name: Nuvio quality checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - hardening/security-data-sync-2026-11
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js api -type f -name '*.js' -print0)

  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild bundles
        run: |
          npm ci
          npm run build
      - name: Check committed bundles are up to date
        run: |
          if ! git diff --exit-code -- dist index.html sw.js; then
            echo "::error::dist/, index.html or sw.js is stale. Run 'npm run build' and commit the result."
            exit 1
          fi
