<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    
    <!-- قناع قطري -->
    <mask id="diagMask">
      <polygon points="0,0 100,0 0,100" fill="white"/>
      <polygon points="100,0 100,100 0,100" fill="black"/>
    </mask>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  
  <!-- N أبيض كامل -->
  <text x="50" y="72" 
        font-size="65" 
        font-weight="800" 
        fill="white" 
        text-anchor="middle" 
        font-family="Inter, Arial, sans-serif">N</text>
  
  <!-- N أسود على الجزء القطري -->
  <text x="50" y="72" 
        font-size="65" 
        font-weight="800" 
        fill="#1a1a1a" 
        text-anchor="middle" 
        font-family="Inter, Arial, sans-serif"
        mask="url(#diagMask)">N</text>
</svg>